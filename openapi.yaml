openapi: 3.0.3
info:
  title: API de Biblioteca
  version: 1.0.0
  description: API para consultar un catálogo de libros

paths:
  /api/libros:
    get:
      summary: Obtener todos los libros
      responses:
        '200':
          description: Lista de libros obtenida correctamente
          content:
            application/json:
              schema:
                type: array
              items:
                type: object
              properties:
                id:
                  type: integer
                titulo:
                  type: string
                autor:
                  type: string

  /api/productos/{id}:
    get:
      summary: "Obtiene un producto por su id"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Producto entontrado"
        "404":
          description: "Producto no encontrado"
